name: nita-clearance

x-backend-build: &backend-build
  context: .
  dockerfile: infra/Dockerfile
  target: backend

x-api-environment: &api-environment
  NODE_ENV: development
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-nita}:${POSTGRES_PASSWORD:-development-only-database}@postgres:5432/${POSTGRES_DB:-nita}
  REDIS_URL: redis://:${REDIS_PASSWORD:-development-only-cache}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-nita-development}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-development-only-storage}
  S3_BUCKET: ${S3_BUCKET:-nita-records}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_REQUIRE_MFA: ${OIDC_REQUIRE_MFA:-false}
  OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
  OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
  OIDC_MFA_ACR: ${OIDC_MFA_ACR:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-database}
      POSTGRES_DB: ${POSTGRES_DB:-nita}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-only-cache}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nita-development}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-only-storage}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/bootstrap/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nita-development}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-only-storage}
      S3_BUCKET: ${S3_BUCKET:-nita-records}
    volumes: ["./infra/minio/init.sh:/bootstrap/init.sh:ro"]
    depends_on:
      minio: { condition: service_healthy }

  migrate:
    build: *backend-build
    command: ["npm", "run", "db:migrate"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    build: *backend-build
    environment: *api-environment
    ports: ["127.0.0.1:${BACKEND_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: frontend
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://backend:4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15

  platform-tests:
    profiles: [test]
    build: *backend-build
    environment:
      <<: *api-environment
      NODE_ENV: test
      LOG_LEVEL: silent
    command: ["npm", "run", "test:integration"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
